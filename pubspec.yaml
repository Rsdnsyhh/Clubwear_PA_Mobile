name: clubwear_app
description: Clubwear - aplikasi toko pakaian pria (proyek akhir Pemrograman Piranti Bergerak).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kaos/
    - assets/images/kemeja/
    - assets/images/celana/
    - assets/images/jaket/
    - assets/images/sweater/
    - assets/images/sepatu/
    - assets/images/aksesoris/
